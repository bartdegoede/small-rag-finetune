[project]
name = "small-rag-finetune"
version = "0.1.0"
description = "Fine-tune small LMs to answer from retrieved passages, or refuse, for in-browser RAG"
readme = "README.md"
authors = [
    { name = "Bart de Goede", email = "bdegoede@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "click>=8.5.0",
    "huggingface-hub>=2.2.0",
    "mlx-lm>=0.31",
    "model2vec>=0.6",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "static-site-search-eval==0.1.0",
]

[project.scripts]
small-rag-finetune = "small_rag_finetune:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
extend-exclude = ["src/small_rag_finetune/vendor"]

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.black]
extend-exclude = "src/small_rag_finetune/vendor"
